[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fashion-size"
dynamic = ["version"]
description = "Kind-specific fashion measurements, locale conversion, and brand size charts."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Andy Babic", email = "andyjbabic@gmail.com" }]
maintainers = [{ name = "Andy Babic", email = "andyjbabic@gmail.com" }]
keywords = [
    "fashion",
    "clothing",
    "footwear",
    "shoe-size",
    "dress-size",
    "size-conversion",
    "measurements",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
testing = [
    "pytest>=8",
]
development = [
    "ruff>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/ababic/fashion-size"
Changelog = "https://github.com/ababic/fashion-size/blob/main/CHANGELOG.md"
Issues = "https://github.com/ababic/fashion-size/issues"

[tool.hatch.version]
path = "src/fashion_size/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_size"]

[tool.hatch.build.targets.wheel.force-include]
"src/fashion_size/fixtures/brand_conversion_charts.json" = "fashion_size/fixtures/brand_conversion_charts.json"
"src/fashion_size/py.typed" = "fashion_size/py.typed"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
