name: Release

# A tag push does not name a branch. The branch job rejects a tag whose commit
# is not on main or a release-* branch, before tests or publishing run.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  branch:
    name: Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main or a release branch
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git branch -r --contains "$commit" | sed 's/^[* ]*//' | grep -Eq '^(origin/main|origin/release-[^/]*)$'; then
            echo "Tag ${GITHUB_REF_NAME} points at ${commit}, which is not on main or a release-* branch."
            git branch -r --contains "$commit" || true
            exit 1
          fi

  test:
    name: Test
    needs: branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version matches tag
        run: |
          uv sync --locked
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(uv run python -c 'from fashion_size import __version__; print(__version__)')"
          echo "tag=${TAG} version=${VERSION}"
          test "${TAG}" = "${VERSION}"

      - name: Build
        run: |
          uv build
          uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fashion-size
    permissions:
      id-token: write
      contents: read
      actions: read
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
