name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[testing]"

      - name: Run tests
        run: pytest

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install -U "ruff>=0.11,<1"

      - name: Run ruff
        run: ruff check src tests

  package:
    name: Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install the wheel
        run: |
          python -m pip install -U pip build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/wheel-install
          /tmp/wheel-install/bin/pip install dist/*.whl
          /tmp/wheel-install/bin/python - <<'PY'
          import pathlib

          import fashion_size
          from fashion_size import SUPPORTED_BRANDS, __version__
          from fashion_size.brands import BRANDS
          from fashion_size.charts import chart_for, load_brand_charts

          root = pathlib.Path(fashion_size.__file__).resolve().parent
          assert (root / "py.typed").is_file()
          chart_ids = [chart.id for brand in BRANDS for chart in brand.charts]
          assert chart_ids
          assert all((root / "fixtures" / "charts" / f"{chart_id}.json").is_file() for chart_id in chart_ids)
          assert __version__
          assert SUPPORTED_BRANDS
          charts = load_brand_charts()
          assert charts
          chart = chart_for("Dune London", "adult-shoe", "adult", "female", product_type="shoes")
          assert chart is not None and chart.rows
          print(f"fashion-size {__version__}: {len(charts)} brand charts")
          PY
